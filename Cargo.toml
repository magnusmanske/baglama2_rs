[package]
name = "baglama2"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/magnusmanske/baglama2_rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

mimalloc = { version = "0.1", features = ["secure"] }
tokio = { version = "^1", features = ["full", "rt-multi-thread"] }
serde_json = "^1"
chrono = "0.4"
anyhow = "1"
bzip2 = "0.5"
wikimisc = { git = "https://github.com/magnusmanske/wikimisc" , features = ["wikidata","database","site-matrix","http","title","logging"] }
log = "0.4"
# zlib backend: the gzb bytes (pinned by test_golden_file) depend on it; it used
# to be enabled implicitly by mysql_async's default features.
flate2 = { version = "1", features = ["zlib"] }
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = 'fat'
codegen-units = 1
